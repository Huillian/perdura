[package]
name = "perdura-core"
description = "Core library of the Perdura network"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.3"
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
zeroize = "1"
